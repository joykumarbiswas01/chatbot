<div class="kb-container">
    <div class="kb-header">
        <h3>🤖 নলেজ বেস চ্যাটবট</h3>
        <div class="kb-sub">PDF · Excel · Word ফাইল থেকে প্রশ্নের উত্তর</div>
    </div>

    <div class="upload-section">
        <label><strong>ফাইল আপলোড করুন (PDF / XLSX / XLS / DOCX / CSV / TXT):</strong></label>
        <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.docx,.csv,.txt" multiple />
        <button onclick="processFiles()">ফাইল প্রসেস করুন</button>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="main-content-grid">
        <div class="sidebar-docs">
            <h4>সংরক্ষিত ফাইলসমূহ</h4>
            <input type="text" id="searchDocs" placeholder="খুঁজুন..." onkeyup="filterDocs()" />
            <div id="docList" class="doc-list">
                <p class="no-docs">কোনো ফাইল নেই</p>
            </div>
            <div class="selected-count" id="selectedCount">০টি ফাইল নির্বাচিত</div>
        </div>

        <div class="chat-pane">
            <div class="selected-doc-info" id="activeDocTitle">নির্বাচিত ফাইল থেকে প্রশ্ন করুন (একাধিক ফাইল বাছাই করা যায়)</div>
            <div class="chat-box" id="chatBox">
                <div class="bot-message message">বাম পাশ থেকে একটি বা একাধিক ফাইল টিক দিন, এরপর প্রশ্ন করুন!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="প্রশ্ন লিখুন..." onkeydown="if(event.key==='Enter') sendQuery();" />
                <button onclick="sendQuery()">পাঠান</button>
            </div>
        </div>
    </div>
</div>

<style>
    .kb-container { max-width: 900px; margin: 20px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); font-family: Arial, sans-serif; overflow: hidden; }
    .kb-header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
    .kb-header h3 { margin: 0; font-size: 18px; }
    .kb-sub { font-size: 12px; opacity: 0.8; margin-top: 3px; }
    .upload-section { padding: 12px 15px; background: #f8f9fa; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 5px; }
    .upload-section input[type="file"] { padding: 6px; background: #fff; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; }
    .upload-section button { background: #27ae60; color: white; border: none; padding: 9px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .status-msg { font-size: 12px; color: #d35400; font-weight: bold; min-height: 16px; }
    .main-content-grid { display: flex; height: 460px; }
    .sidebar-docs { width: 35%; border-right: 1px solid #ddd; padding: 10px; background: #fdfdfd; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-docs h4 { margin: 0 0 5px 0; font-size: 14px; color: #333; }
    .sidebar-docs input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    .doc-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .doc-item { padding: 8px; background: #fff; border: 1px solid #e1e1e1; border-radius: 5px; cursor: pointer; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .doc-item:hover { border-color: #3498db; }
    .doc-item.active { background: #ebf5fb; border-color: #3498db; }
    .doc-item label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .delete-btn { color: #e74c3c; border: none; background: none; cursor: pointer; font-weight: bold; font-size: 14px; }
    .no-docs { font-size: 12px; color: #888; text-align: center; margin-top: 20px; }
    .selected-count { font-size: 11px; color: #666; text-align: center; }
    .chat-pane { width: 65%; display: flex; flex-direction: column; background: #fff; }
    .selected-doc-info { background: #eaf2f8; padding: 8px 12px; font-size: 12px; color: #2980b9; font-weight: bold; border-bottom: 1px solid #ddd; }
    .chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #fafafa; }
    .message { padding: 8px 12px; border-radius: 6px; max-width: 85%; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    .user-message { background: #3498db; color: white; align-self: flex-end; }
    .bot-message { background: #e5e7e9; color: #333; align-self: flex-start; }
    .chat-input-area { display: flex; border-top: 1px solid #ddd; }
    .chat-input-area input { flex: 1; padding: 10px; border: none; outline: none; font-size: 13px; }
    .chat-input-area button { background: #3498db; color: white; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; }
    @media (max-width: 600px) { .main-content-grid { flex-direction: column; height: auto; } .sidebar-docs { width: 100%; height: 180px; } .chat-pane { height: 340px; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>

<script type="module">
    import { GoogleGenAI } from "https://cdn.jsdelivr.net/npm/@google/genai@latest/+esm";

    const API_KEY = "AQ.Ab8RN6KoiqxKaoQYliKs6YPRTgkVvaoCRZ4bP7vyWGGaw8-ZMg";
    const MODEL = "gemini-2.5-flash";
    const ai = new GoogleGenAI({ apiKey: API_KEY });

    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

    const STORAGE_KEY = "kb_chatbot_docs_v1";
    let kbDocs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let selectedIds = new Set();

    window.onload = function () { renderDocList(); };

    async function processFiles() {
        const input = document.getElementById("fileInput");
        const statusMsg = document.getElementById("statusMsg");
        const files = Array.from(input.files || []);
        if (files.length === 0) {
            alert("দয়া করে একটি বা একাধিক ফাইল সিলেক্ট করুন!");
            return;
        }

        for (const file of files) {
            try {
                statusMsg.innerText = `"${file.name}" প্রসেস হচ্ছে...`;
                const ext = file.name.split(".").pop().toLowerCase();
                let text = "";

                if (ext === "pdf") {
                    text = await extractPdfText(file, statusMsg);
                } else if (ext === "xlsx" || ext === "xls") {
                    text = await extractExcelText(file);
                } else if (ext === "docx") {
                    text = await extractDocxText(file);
                } else if (ext === "csv" || ext === "txt") {
                    text = await file.text();
                } else {
                    statusMsg.innerText = `"${file.name}" — এই ফরম্যাট সাপোর্টেড না, স্কিপ করা হলো।`;
                    continue;
                }

                if (!text || !text.trim()) {
                    statusMsg.innerText = `"${file.name}" থেকে কোনো টেক্সট পাওয়া যায়নি (স্ক্যান করা ছবি-ভিত্তিক PDF হলে টেক্সট বের হবে না)।`;
                    continue;
                }

                const chunks = chunkText(text);
                kbDocs.push({
                    id: "doc_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
                    name: file.name,
                    type: ext,
                    chunks: chunks,
                    addedAt: new Date().toISOString()
                });
                saveDocs();
            } catch (err) {
                statusMsg.innerText = `"${file.name}" প্রসেস করতে সমস্যা হয়েছে: ${err.message}`;
                console.error(err);
            }
        }

        input.value = "";
        statusMsg.innerText = "সব ফাইল প্রসেস সম্পন্ন হয়েছে!";
        renderDocList();
        setTimeout(() => { statusMsg.innerText = ""; }, 4000);
    }

    async function extractPdfText(file, statusMsg) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            if (statusMsg) statusMsg.innerText = `"${file.name}" — পেজ ${i}/${pdf.numPages} পড়া হচ্ছে...`;
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            const pageText = content.items.map(item => item.str).join(" ");
            fullText += `\n\n[পেজ ${i}]\n${pageText}`;
        }
        return fullText;
    }

    async function extractExcelText(file) {
        const arrayBuffer = await file.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: "array" });
        let fullText = "";
        workbook.SheetNames.forEach(sheetName => {
            const sheet = workbook.Sheets[sheetName];
            const csv = XLSX.utils.sheet_to_csv(sheet);
            fullText += `\n\n[শীট: ${sheetName}]\n${csv}`;
        });
        return fullText;
    }

    async function extractDocxText(file) {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
        return result.value;
    }

    function chunkText(text, size = 900, overlap = 150) {
        const clean = text.replace(/\r/g, "").trim();
        const chunks = [];
        let start = 0;
        while (start < clean.length) {
            const end = Math.min(start + size, clean.length);
            chunks.push(clean.slice(start, end));
            start += (size - overlap);
        }
        return chunks;
    }

    function saveDocs() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(kbDocs));
        } catch (e) {
            alert("স্টোরেজ ভরে গেছে (browser limit ~5-10MB)। পুরনো কিছু ফাইল ডিলিট করুন।");
        }
    }

    function renderDocList(filter = "") {
        const docListDiv = document.getElementById("docList");
        docListDiv.innerHTML = "";
        const filtered = kbDocs.filter(doc => doc.name.toLowerCase().includes(filter.toLowerCase()));

        if (filtered.length === 0) {
            docListDiv.innerHTML = `<p class="no-docs">কোনো ফাইল নেই</p>`;
        } else {
            filtered.forEach(doc => {
                const item = document.createElement("div");
                item.className = `doc-item ${selectedIds.has(doc.id) ? "active" : ""}`;
                const icon = { pdf: "📄", xlsx: "📊", xls: "📊", docx: "📝", csv: "📊", txt: "📃" }[doc.type] || "📄";
                item.innerHTML = `
                    <input type="checkbox" ${selectedIds.has(doc.id) ? "checked" : ""} onchange="toggleSelect('${doc.id}')" />
                    <label onclick="toggleSelect('${doc.id}')">${icon} ${escapeHtml(doc.name)}</label>
                    <button class="delete-btn" onclick="deleteDoc(event, '${doc.id}')">×</button>
                `;
                docListDiv.appendChild(item);
            });
        }
        updateSelectedCount();
    }

    function toggleSelect(id) {
        if (selectedIds.has(id)) selectedIds.delete(id);
        else selectedIds.add(id);
        renderDocList(document.getElementById("searchDocs").value);
    }

    function updateSelectedCount() {
        document.getElementById("selectedCount").innerText = `${selectedIds.size}টি ফাইল নির্বাচিত`;
    }

    function filterDocs() {
        renderDocList(document.getElementById("searchDocs").value);
    }

    function deleteDoc(event, id) {
        event.stopPropagation();
        if (confirm("ফাইলটি মুছে ফেলতে চান?")) {
            kbDocs = kbDocs.filter(d => d.id !== id);
            selectedIds.delete(id);
            saveDocs();
            renderDocList(document.getElementById("searchDocs").value);
        }
    }

    function getRelevantContext(question, charBudget = 7000) {
        const docs = kbDocs.filter(d => selectedIds.has(d.id));
        const qWords = question.toLowerCase()
            .split(/[^a-zA-Zঀ-৿0-9]+/)
            .filter(w => w.length > 1);

        let scored = [];
        docs.forEach(doc => {
            doc.chunks.forEach((chunk, idx) => {
                const lower = chunk.toLowerCase();
                let score = 0;
                qWords.forEach(w => {
                    if (lower.includes(w)) score += 1;
                });
                scored.push({ docName: doc.name, chunk, idx, score });
            });
        });

        scored.sort((a, b) => b.score - a.score);

        const hasMatch = scored.some(s => s.score > 0);
        let selected = [];
        if (hasMatch) {
            selected = scored.filter(s => s.score > 0);
        } else {
            docs.forEach(doc => {
                doc.chunks.slice(0, 5).forEach((chunk, idx) => selected.push({ docName: doc.name, chunk, idx, score: 0 }));
            });
        }

        let context = "";
        for (const item of selected) {
            const piece = `\n\n[ফাইল: ${item.docName}]\n${item.chunk}`;
            if (context.length + piece.length > charBudget) break;
            context += piece;
        }
        return context;
    }

    async function sendQuery() {
        if (selectedIds.size === 0) {
            alert("দয়া করে বাম পাশ থেকে অন্তত একটি ফাইল টিক দিন!");
            return;
        }

        const inputEl = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const question = inputEl.value.trim();
        if (!question) return;

        chatBox.innerHTML += `<div class="user-message message">${escapeHtml(question)}</div>`;
        inputEl.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" class="bot-message message">প্রাসঙ্গিক তথ্য খুঁজে উত্তর তৈরি করা হচ্ছে...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const context = getRelevantContext(question);
            const prompt = `আপনি একজন সহায়ক অ্যাসিস্ট্যান্ট। নিচে কিছু ডকুমেন্ট থেকে নেওয়া তথ্য দেওয়া হলো। শুধু এই তথ্যের ভিত্তিতে প্রশ্নের সঠিক ও নির্ভুল উত্তর দিন। তথ্যে না থাকলে স্পষ্ট করে বলুন "এই তথ্য ডকুমেন্টে পাওয়া যায়নি"।\n\n--- ডকুমেন্ট থেকে তথ্য ---${context}\n\n--- প্রশ্ন ---\n${question}`;

            const result = await ai.models.generateContent({
                model: MODEL,
                contents: prompt
            });

            document.getElementById(loadingId).remove();

            const answer = result?.text;
            if (answer) {
                chatBox.innerHTML += `<div class="bot-message message">${escapeHtml(answer)}</div>`;
            } else {
                chatBox.innerHTML += `<div class="bot-message message">উত্তর পাওয়া যায়নি।</div>`;
            }
        } catch (error) {
            const loadingEl = document.getElementById(loadingId);
            if (loadingEl) loadingEl.remove();
            chatBox.innerHTML += `<div class="bot-message message">ত্রুটি: ${escapeHtml(error.message)}</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
        const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    // onclick হ্যান্ডলারগুলো এই ফাংশনগুলো খুঁজে পাওয়ার জন্য গ্লোবালি জুড়ে দেওয়া হলো (module scope ফিক্স)
    window.processFiles = processFiles;
    window.filterDocs = filterDocs;
    window.sendQuery = sendQuery;
    window.toggleSelect = toggleSelect;
    window.deleteDoc = deleteDoc;
</script>
